<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3fa">
  <title>MOVE FLOW — 이사 여정</title>
  <style>
    :root{--ink:#272331;--muted:#817b8d;--purple:#6948c8;--purple-dark:#5138a0;--lav:#f2edfb;--lav2:#e4daf6;--line:#eee9f2;--green:#55a487;--green-bg:#e7f4ee;--orange:#ae5729;--orange-bg:#fff0e5;--white:#fff;--bg:#f6f3fa;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-synthesis:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 9% 15%,#eee8f6,transparent 35%),radial-gradient(ellipse at 92% 88%,#f0eaf7,transparent 29%),var(--bg);color:var(--ink)}button,input{font:inherit;color:inherit}button{cursor:pointer}
    .stage{min-height:100vh;display:grid;place-items:center;padding:24px}.app{width:min(100%,800px);min-height:min(1480px,calc(100vh - 48px));background:var(--white);border:1px solid #e9e2ed;border-radius:42px;box-shadow:0 28px 78px #41345d18;overflow:hidden;display:flex;flex-direction:column;position:relative}.topbar{height:112px;display:flex;align-items:center;justify-content:space-between;padding:0 44px;flex:0 0 auto}.brand{display:flex;align-items:center;gap:14px;font-size:28px;letter-spacing:.015em;color:var(--purple-dark);font-weight:780}.mark{width:51px;height:51px;border-radius:17px;background:var(--purple);display:grid;place-items:center;color:white;font-size:28px;font-weight:800}.bell{border:0;background:transparent;font-size:24px;position:relative;width:44px;height:44px}.bell:after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:#ec805d;top:6px;right:6px;border:2px solid white}.content{flex:1;padding:25px 44px 42px;overflow:auto;scrollbar-width:none}.content::-webkit-scrollbar{display:none}.bottom-nav{display:grid;grid-template-columns:repeat(5,1fr);height:84px;flex:0 0 auto;border-top:1px solid #f1edf4;background:#fff;padding:8px 20px max(10px,env(safe-area-inset-bottom))}.nav-btn{border:0;background:transparent;color:#9691a0;display:grid;align-content:center;justify-items:center;gap:5px;font-size:11px;font-weight:600}.nav-btn i{font-style:normal;width:31px;height:31px;display:grid;place-items:center;border-radius:11px;font-size:18px}.nav-btn.active{color:var(--purple-dark)}.nav-btn.active i{background:var(--lav)}
    .eyebrow{font-size:17px;color:var(--muted);font-weight:620;margin:2px 0 13px}.headline{font-size:38px;line-height:1.28;letter-spacing:-.055em;font-weight:760;margin:0}.project-line{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:20px}.project-pill{border-radius:999px;padding:11px 20px;background:var(--lav);color:var(--purple-dark);font-size:17px;font-weight:740;white-space:nowrap}.move-date{font-size:18px;color:var(--muted);white-space:nowrap}.progress{margin:37px 0 31px}.progress-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;font-size:21px;font-weight:700}.progress-head span{color:var(--purple-dark);font-size:19px}.track{height:11px;border-radius:20px;background:#eee9f2;overflow:hidden}.track span{display:block;width:37.5%;height:100%;border-radius:inherit;background:var(--purple)}
    .mission{padding:31px 34px;border-radius:33px;background:linear-gradient(130deg,#f3effb,#f7f4fc);margin-bottom:50px}.mission-label{font-size:19px;font-weight:730;color:var(--purple-dark);display:flex;align-items:center;gap:10px;margin-bottom:24px}.spark{font-size:24px}.mission h2{font-size:27px;letter-spacing:-.04em;margin:0 0 13px}.mission p{font-size:18px;color:var(--muted);line-height:1.65;margin:0}.mission-footer{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:25px}.due{border-radius:18px;padding:13px 18px;background:var(--orange-bg);color:var(--orange);font-size:17px;font-weight:740;white-space:nowrap}.primary{border:0;border-radius:18px;background:var(--purple);color:#fff;font-size:18px;font-weight:740;padding:19px 27px;min-height:67px;box-shadow:0 8px 17px #6948c828}.primary:hover{background:var(--purple-dark)}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:23px}.section-head h2{font-size:23px;letter-spacing:-.035em;margin:0}.link-btn{border:0;background:transparent;color:var(--purple);font-size:16px;font-weight:720;padding:8px 0 8px 8px}.event-list{margin-bottom:58px}.event{min-height:95px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:92px 1fr 20px;align-items:center;gap:18px}.event:last-child{border-bottom:0}.event-date strong{font-size:19px;display:block}.event-date small{font-size:15px;color:var(--muted);display:block;margin-top:4px}.event-copy strong{font-size:18px;display:block}.event-copy small{font-size:15px;color:var(--muted);display:block;margin-top:6px}.dot{width:14px;height:14px;border-radius:50%;background:var(--purple);justify-self:center}.dot.green{background:var(--green)}.dot.gray{background:#c5bfce}.family{display:flex;align-items:center;justify-content:space-between;gap:15px}.family-copy strong{font-size:19px;display:block}.family-copy small{display:block;font-size:15px;color:var(--muted);margin-top:7px}.avatars{display:flex;align-items:center;gap:0}.avatar{width:54px;height:54px;border:3px solid #fff;margin-left:-9px;border-radius:50%;display:grid;place-items:center;background:#f4d7c8;color:#76574b;font-size:18px;font-weight:750;box-shadow:0 1px 0 #e8e2ee}.avatar:first-child{margin-left:0}.avatar.green{background:#dcece3;color:#42745e}.avatar.add{background:#fff;color:var(--purple);border:2px solid #e4daf6;font-size:25px;font-weight:450}
    .onboard{min-height:850px;display:flex;flex-direction:column;padding:16px 0 8px}.onboard-progress{display:flex;gap:8px;margin:8px 0 31px}.onboard-progress span{height:6px;border-radius:10px;background:#ece8f1;flex:1}.onboard-progress span.active{background:var(--purple)}.onboard-title{font-size:35px;line-height:1.35;letter-spacing:-.05em;margin:0}.onboard-copy{font-size:17px;line-height:1.6;color:var(--muted);margin:11px 0 0}.choice-list{display:grid;gap:12px;margin:30px 0 18px}.choice{width:100%;border:1px solid var(--line);border-radius:18px;background:#fff;padding:17px;min-height:79px;display:flex;align-items:center;gap:14px;text-align:left}.choice.selected{border:2px solid #8f75df;background:#fbf9ff}.choice-icon{width:45px;height:45px;flex:0 0 45px;border-radius:15px;background:var(--lav);display:grid;place-items:center;color:var(--purple);font-size:20px}.choice strong{font-size:16px;display:block}.choice small{display:block;color:var(--muted);font-size:13px;margin-top:5px}.choice-check{margin-left:auto;color:var(--purple);font-size:19px}.onboard-foot{margin-top:auto;padding-top:20px}.secondary-link{display:block;margin:14px auto 0;border:0;background:transparent;color:var(--muted);font-size:14px;padding:9px}.form-row{margin:22px 0}.form-row label{display:block;font-size:15px;font-weight:720;margin-bottom:9px}.form-row input{width:100%;height:58px;border:1px solid #e8e3ed;border-radius:14px;padding:0 15px;background:white;font-size:16px;outline-color:#a995e5}.input-hint{color:var(--muted);font-size:12px;margin-top:8px}.onboard-art{height:240px;margin:24px auto 25px;position:relative;width:min(100%,360px);background:radial-gradient(ellipse at 50% 72%,#eee8fb,transparent 66%)}.road{position:absolute;width:300px;height:98px;left:30px;bottom:19px;border-bottom:6px solid #ded5f7;border-right:6px solid #ded5f7;border-radius:0 0 60% 43%;transform:rotate(-8deg)}.house{position:absolute;left:50%;top:20px;transform:translateX(-50%);width:142px;height:130px}.roof{position:absolute;inset:0 0 auto;height:68px;background:linear-gradient(145deg,#a48cf0,#6948c8);clip-path:polygon(50% 0,100% 54%,88% 54%,88% 100%,12% 100%,12% 54%,0 54%);filter:drop-shadow(0 7px 6px #573baa39)}.walls{position:absolute;left:21px;right:21px;bottom:0;height:77px;border-radius:5px 5px 11px 11px;background:linear-gradient(135deg,#fff,#eee9f9);box-shadow:0 14px 22px #77659121}.door{position:absolute;width:30px;height:45px;left:56px;bottom:0;border-radius:9px 9px 0 0;background:#c9baf1}.box{position:absolute;width:46px;height:40px;border-radius:8px;background:#eac7a5;box-shadow:inset 0 -7px #d5a780}.box:after{content:"";position:absolute;left:19px;top:0;bottom:0;width:7px;background:#f7dfc5}.box.a{left:29px;bottom:23px;transform:rotate(-5deg)}.box.b{right:23px;bottom:18px;width:54px;height:47px;transform:rotate(5deg)}.start-art-caption{text-align:center;color:#827b92;font-size:14px;margin-top:2px}
    .toast{position:absolute;bottom:100px;left:50%;transform:translate(-50%,10px);opacity:0;pointer-events:none;background:#2b2733;color:#fff;border-radius:99px;padding:13px 19px;font-size:13px;white-space:nowrap;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:850px){.stage{padding:12px}.app{width:100%;min-height:calc(100vh - 24px);border-radius:30px}.topbar{height:85px;padding:0 28px}.brand{font-size:22px}.mark{width:43px;height:43px;font-size:24px}.content{padding:20px 28px 34px}.headline{font-size:32px}.eyebrow{font-size:15px}.project-pill{font-size:14px;padding:9px 14px}.move-date{font-size:14px}.progress-head{font-size:18px}.mission{padding:24px;border-radius:26px;margin-bottom:38px}.mission-label{font-size:16px;margin-bottom:18px}.mission h2{font-size:22px}.mission p{font-size:15px}.due{font-size:13px;padding:11px 13px}.primary{font-size:15px;padding:14px 19px;min-height:54px}.section-head h2{font-size:19px}.event{grid-template-columns:75px 1fr 17px;min-height:82px;gap:12px}.event-date strong,.event-copy strong{font-size:15px}.event-date small,.event-copy small{font-size:12px}.family-copy strong{font-size:16px}.family-copy small{font-size:13px}.avatar{width:46px;height:46px;font-size:15px}.onboard{min-height:700px}.onboard-title{font-size:30px}.onboard-copy{font-size:15px}}
    @media(max-width:520px){.stage{padding:0}.app{min-height:100dvh;border:0;border-radius:0;box-shadow:none}.topbar{height:73px;padding:0 21px}.brand{font-size:19px;gap:10px}.mark{width:38px;height:38px;border-radius:13px;font-size:21px}.content{padding:20px 22px 30px}.eyebrow{font-size:13px;margin-bottom:8px}.headline{font-size:28px}.project-line{align-items:flex-start;flex-direction:column;gap:9px;margin-top:15px}.project-pill{font-size:13px}.move-date{font-size:13px}.progress{margin:27px 0 22px}.progress-head{font-size:15px;margin-bottom:11px}.progress-head span{font-size:14px}.track{height:8px}.mission{padding:19px;border-radius:23px;margin-bottom:31px}.mission-label{font-size:14px;gap:7px;margin-bottom:14px}.spark{font-size:18px}.mission h2{font-size:18px;margin-bottom:8px}.mission p{font-size:13px}.mission-footer{margin-top:17px;align-items:flex-end}.due{font-size:11px;padding:10px 11px;border-radius:13px}.primary{font-size:13px;padding:12px 14px;min-height:48px;border-radius:13px}.section-head{margin-bottom:14px}.section-head h2{font-size:17px}.link-btn{font-size:12px}.event-list{margin-bottom:36px}.event{grid-template-columns:59px 1fr 14px;min-height:72px;gap:9px}.event-date strong,.event-copy strong{font-size:13px}.event-date small,.event-copy small{font-size:11px}.dot{width:10px;height:10px}.family-copy strong{font-size:14px}.family-copy small{font-size:11px;margin-top:4px}.avatar{width:39px;height:39px;margin-left:-7px;font-size:13px}.bottom-nav{height:72px;padding-left:7px;padding-right:7px}.nav-btn{font-size:9px}.nav-btn i{width:27px;height:27px;font-size:16px}.onboard{min-height:calc(100dvh - 145px);padding-top:6px}.onboard-progress{margin:3px 0 23px}.onboard-title{font-size:26px}.onboard-copy{font-size:13px}.choice-list{gap:9px;margin:22px 0 13px}.choice{min-height:68px;padding:12px;border-radius:15px}.choice-icon{width:38px;height:38px;flex-basis:38px;border-radius:12px}.choice strong{font-size:13px}.choice small{font-size:11px}.form-row{margin:18px 0}.form-row label{font-size:13px}.form-row input{height:52px;font-size:15px}.onboard-art{height:205px;transform:scale(.88);transform-origin:top center;margin-bottom:-2px}.secondary-link{font-size:12px}.toast{font-size:11px;padding:11px 15px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="stage"><section class="app" aria-label="MOVE FLOW 앱 프로토타입">
    <header class="topbar" id="topbar"><div class="brand"><span class="mark">m</span> MOVE FLOW</div><button class="bell" aria-label="알림" data-action="notice">♧</button></header>
    <div class="content" id="content"></div>
    <nav class="bottom-nav" id="bottom-nav" aria-label="주 메뉴">
      <button class="nav-btn active" data-tab="home"><i>⌂</i>홈</button><button class="nav-btn" data-tab="schedule"><i>▦</i>일정</button><button class="nav-btn" data-tab="prepare"><i>✓</i>준비</button><button class="nav-btn" data-tab="services"><i>⌖</i>서비스</button><button class="nav-btn" data-tab="my"><i>●</i>마이</button>
    </nav><div class="toast" role="status" aria-live="polite"></div>
  </section></main>
  <script>
    const content=document.getElementById('content');
    const nav=document.getElementById('bottom-nav');
    const topbar=document.getElementById('topbar');
    const toast=document.querySelector('.toast');
    let moveType='집 매도 + 새집 매수';
    let moveDate='';
    let projectName='우리 집 이사';
    let timer;
    const datePlus=(days)=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)};
    const dateLabel=(value)=>{if(!value)return '날짜를 정해 주세요';const d=new Date(value+'T12:00:00');return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`};
    const dday=(value)=>{if(!value)return '날짜 미정';const d=new Date(value+'T00:00:00');const now=new Date();now.setHours(0,0,0,0);const days=Math.ceil((d-now)/86400000);return days>=0?`D-${days}`:`D+${Math.abs(days)}`};
    function showToast(text){toast.textContent=text;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),2200)}
    function home(){return `
      <section>
        <p class="eyebrow">처음이라 막막한 이사, 함께 정리해요</p>
        <h1 class="headline">안녕하세요, 유영님</h1>
        <div class="project-line"><span class="project-pill">${moveType}</span><span class="move-date">입주 예정 ${dateLabel(moveDate)} · ${dday(moveDate)}</span></div>
      </section>
      <section class="progress" aria-label="이사 진행 상황">
        <div class="progress-head"><strong>${projectName} 준비</strong><span>3/8 단계</span></div><div class="track"><span></span></div>
      </section>
      <section class="mission">
        <div class="mission-label"><span class="spark">✦</span> 오늘의 다음 단계</div>
        <h2>매수자 대출 서류 제출</h2>
        <p>은행에 제출할 서류를 확인하고<br>기한 안에 챙겨보세요.</p>
        <div class="mission-footer"><span class="due">◷　11월 7일 · 3일 남음</span><button class="primary" data-screen="documents">준비물 확인</button></div>
      </section>
      <section class="section-head"><h2>이번 주 일정</h2><button class="link-btn" data-screen="schedule">전체 일정 →</button></section>
      <section class="event-list">
        <div class="event"><div class="event-date"><strong>11.05</strong><small>목요일</small></div><div class="event-copy"><strong>매도 계약서 특약 확인</strong><small>유영님 · 매도</small></div><span class="dot"></span></div>
        <div class="event"><div class="event-date"><strong>11.07</strong><small>토요일</small></div><div class="event-copy"><strong>대출 서류 은행 제출</strong><small>민수님 · 매수</small></div><span class="dot green"></span></div>
        <div class="event"><div class="event-date"><strong>11.09</strong><small>월요일</small></div><div class="event-copy"><strong>이사 견적 비교하기</strong><small>함께 할 일</small></div><span class="dot gray"></span></div>
      </section>
      <section class="family"><div class="family-copy"><strong>함께 준비 중</strong><small>유영님과 민수님이 같이 관리해요</small></div><div class="avatars" aria-label="참여자"><span class="avatar">유</span><span class="avatar green">민</span><button class="avatar add" data-screen="family" aria-label="가족 초대">+</button></div></section>`}
    function start(){return `<section class="onboard"><div class="eyebrow">이사의 모든 과정을, 한 번에</div><h1 class="onboard-title">복잡한 이사,<br>이제 하나씩 클리어!</h1><p class="onboard-copy">매도부터 매수, 이사와 입주까지<br>나의 새로운 시작을 함께 준비해요.</p><div class="onboard-art" aria-hidden="true"><div class="road"></div><div class="house"><div class="roof"></div><div class="walls"></div><div class="door"></div></div><div class="box a"></div><div class="box b"></div></div><p class="start-art-caption">MOVE FLOW와 함께 준비해요</p><div class="onboard-foot"><button class="primary" style="width:100%" data-screen="type">시작하기</button><button class="secondary-link" data-action="notice">이미 계정이 있나요?　로그인</button></div></section>`}
    function type(){return `<section class="onboard"><div class="onboard-progress"><span class="active"></span><span></span></div><p class="eyebrow">1 / 2　·　이사 유형</p><h1 class="onboard-title">어떤 이사를<br>준비하고 계세요?</h1><p class="onboard-copy">상황에 맞는 일정과 준비물을 알려드릴게요.</p><div class="choice-list">
      <button class="choice selected" data-choice="집 매도 + 새집 매수"><span class="choice-icon">⌂</span><span><strong>집 매도 + 새집 매수</strong><small>기존 집을 팔고 새집을 구매해요</small></span><span class="choice-check">●</span></button>
      <button class="choice" data-choice="새집 매수"><span class="choice-icon">＋</span><span><strong>새집 매수</strong><small>새로운 집을 구매해요</small></span><span class="choice-check"></span></button>
      <button class="choice" data-choice="기존 집 매도"><span class="choice-icon">↗</span><span><strong>기존 집 매도</strong><small>집을 팔고 이사해요</small></span><span class="choice-check"></span></button>
      <button class="choice" data-choice="전·월세 이사"><span class="choice-icon">▤</span><span><strong>전·월세 이사</strong><small>전세나 월세로 이동해요</small></span><span class="choice-check"></span></button>
      </div><div class="onboard-foot"><button class="primary" style="width:100%" data-screen="dates">다음</button><button class="secondary-link" data-screen="start">이전으로</button></div></section>`}
    function dates(){return `<section class="onboard"><div class="onboard-progress"><span class="active"></span><span class="active"></span></div><p class="eyebrow">2 / 2　·　이사 날짜</p><h1 class="onboard-title">입주 예정일을<br>알려주세요</h1><p class="onboard-copy">날짜에 맞춰 먼저 챙길 일을 정리할게요.<br>정확하지 않아도 나중에 바꿀 수 있어요.</p>
      <div class="form-row"><label for="project">이사 이름</label><input id="project" type="text" value="${projectName}" placeholder="예: 우리 집 이사"></div>
      <div class="form-row"><label for="move-date">입주 예정일</label><input id="move-date" type="date" value="${moveDate||datePlus(42)}"><div class="input-hint">예상 날짜로 시작하고, 이후에 수정할 수 있어요.</div></div>
      <div class="hint" style="font-size:14px;line-height:1.6;color:var(--muted);background:#f8f6fb;border-radius:15px;padding:15px">가족 초대와 세부 거래 일정은 홈에서 천천히 추가할 수 있어요.</div>
      <div class="onboard-foot"><button class="primary" style="width:100%" data-action="create">이사 여정 만들기</button><button class="secondary-link" data-screen="type">이전으로</button></div></section>`}
    function screen(name){
      topbar.hidden=name==='start';nav.hidden=['start','type','dates'].includes(name);
      if(name==='start'){content.innerHTML=start();}
      else if(name==='type'){content.innerHTML=type();}
      else if(name==='dates'){content.innerHTML=dates();}
      else if(name==='home'){content.innerHTML=home();}
      else if(name==='documents'){content.innerHTML=`<p class="eyebrow">거래 유형별로 차근차근</p><h1 class="headline">서류 관리</h1><p class="onboard-copy">필요한 서류와 제출 기한을 모았어요.</p><div class="mission" style="margin-top:24px"><div class="mission-label">✦　AI 서류 가이드</div><p>은행과 거래 유형에 따라 필요한 서류가 달라요. 제출처에 기준을 확인해 주세요.</p></div><div class="event"><div class="event-copy"><strong>매수 매매계약서</strong><small>계약 이후 · 매수</small></div><span class="dot green"></span></div><div class="event"><div class="event-copy"><strong>주민등록등본</strong><small>은행 기준 확인</small></div><span class="due" style="font-size:12px;padding:8px">필요</span></div><div class="event"><div class="event-copy"><strong>대출 신청 서류</strong><small>11월 7일까지</small></div><span class="dot"></span></div><div class="event"><div class="event-copy"><strong>전입 신고</strong><small>입주 후 확인</small></div><span class="dot gray"></span></div>`;}
      else if(name==='schedule'){content.innerHTML=`<p class="eyebrow">매도부터 입주까지</p><h1 class="headline">통합 일정</h1><p class="onboard-copy">거래와 이사 날짜를 한 흐름으로 확인해요.</p><section class="event-list" style="margin-top:25px"><div class="event"><div class="event-date"><strong>11.05</strong><small>목요일</small></div><div class="event-copy"><strong>매도 계약서 특약 확인</strong><small>유영님 · 매도</small></div><span class="dot"></span></div><div class="event"><div class="event-date"><strong>11.07</strong><small>토요일</small></div><div class="event-copy"><strong>대출 서류 은행 제출</strong><small>민수님 · 매수</small></div><span class="dot green"></span></div><div class="event"><div class="event-date"><strong>11.09</strong><small>월요일</small></div><div class="event-copy"><strong>이사 견적 비교하기</strong><small>함께 할 일</small></div><span class="dot gray"></span></div><div class="event"><div class="event-date"><strong>12.16</strong><small>수요일</small></div><div class="event-copy"><strong>새집 입주 예정일</strong><small>가족 함께</small></div><span class="dot gray"></span></div></section>`;}
      else if(name==='services'){content.innerHTML=`<p class="eyebrow">필요한 도움을 한곳에서</p><h1 class="headline">이사 서비스</h1><p class="onboard-copy">조건에 맞는 업체를 찾고 비교해요.</p><div class="choice-list" style="grid-template-columns:1fr 1fr;margin-top:25px"><button class="choice"><span class="choice-icon">▤</span><span><strong>법무사</strong><small>지역별 검색</small></span></button><button class="choice"><span class="choice-icon">↗</span><span><strong>이사 견적</strong><small>업체 비교</small></span></button><button class="choice"><span class="choice-icon">⌂</span><span><strong>가구·가전</strong><small>중고·나눔·폐기</small></span></button><button class="choice"><span class="choice-icon">✧</span><span><strong>인테리어</strong><small>견적·포트폴리오</small></span></button><button class="choice"><span class="choice-icon">✦</span><span><strong>입주 청소</strong><small>지역별 비교</small></span></button><button class="choice"><span class="choice-icon">♻</span><span><strong>폐기물</strong><small>신고·수거 안내</small></span></button></div><div class="hint">검증된 외부 업체를 연결하는 방식으로 시작해요.</div>`;}
      else if(name==='family'){content.innerHTML=`<p class="eyebrow">함께 준비하면 더 수월해요</p><h1 class="headline">가족과 함께</h1><div class="family" style="margin-top:27px"><div class="family-copy"><strong>함께 준비 중</strong><small>일정과 할 일을 나눠요</small></div><div class="avatars"><span class="avatar">유</span><span class="avatar green">민</span><button class="avatar add" data-action="notice">+</button></div></div><div class="event" style="margin-top:25px"><div class="event-copy"><strong>이사업체 예약하기</strong><small>민수님 · 11월 9일까지</small></div><span class="dot green"></span></div><div class="event"><div class="event-copy"><strong>전입 신고 준비하기</strong><small>어머니 · 입주 전 확인</small></div><span class="dot gray"></span></div><div class="event"><div class="event-copy"><strong>가구 배치 정하기</strong><small>유영님 · 함께 상의</small></div><span class="dot gray"></span></div>`;}
      else if(name==='my'){content.innerHTML=`<p class="eyebrow">계정과 함께 준비하는 사람들</p><h1 class="headline">마이</h1><div class="family" style="margin:25px 0"><span class="avatar">유</span><div class="family-copy" style="flex:1"><strong>유영님</strong><small>MOVE FLOW 이용 중</small></div><span>›</span></div><div class="event" data-screen="family"><div class="event-copy"><strong>가족 공동 관리</strong><small>함께 준비하는 사람 2명</small></div><span>›</span></div><div class="event" data-screen="money"><div class="event-copy"><strong>자금 관리</strong><small>계약금·중도금·잔금 일정</small></div><span>›</span></div><div class="event"><div class="event-copy"><strong>알림과 설정</strong><small>마감일·계정 설정</small></div><span>›</span></div>`;}
      else if(name==='money'){content.innerHTML=`<p class="eyebrow">예정일을 놓치지 않도록</p><h1 class="headline">자금 관리</h1><div class="mission" style="margin-top:25px"><div class="mission-label">예정 지출 합계</div><h2 style="font-size:28px">8억 5,000만원</h2><p>화면 설명을 위한 예시 금액이에요.</p></div><div class="event"><div class="event-copy"><strong>계약금 · 1억 7,000만원</strong><small>2026.11.05 · 매수</small></div></div><div class="event"><div class="event-copy"><strong>중도금 · 3억 4,000만원</strong><small>2026.11.18 · 매수</small></div></div><div class="event"><div class="event-copy"><strong>잔금 · 3억 4,000만원</strong><small>2026.12.15 · 매수</small></div></div><div class="hint">정확한 금액과 날짜는 계약서 및 금융기관 안내를 확인해 주세요.</div>`;}
      else content.innerHTML=home();
      document.querySelectorAll('.nav-btn').forEach(button=>{const tab=button.dataset.tab;const active=(name==='home'||name==='family'||name==='money')?tab===(name==='home'?'home':'my'):tab===(name==='documents'?'prepare':name);button.classList.toggle('active',active)});
      content.scrollTop=0;
    }
    document.addEventListener('click',event=>{
      const choice=event.target.closest('[data-choice]');if(choice){moveType=choice.dataset.choice;document.querySelectorAll('.choice').forEach(item=>{const active=item===choice;item.classList.toggle('selected',active);const check=item.querySelector('.choice-check');if(check)check.textContent=active?'●':''});return}
      const tab=event.target.closest('[data-tab]');if(tab){screen(tab.dataset.tab==='prepare'?'documents':tab.dataset.tab);return}
      const next=event.target.closest('[data-screen]');if(next){screen(next.dataset.screen);return}
      const action=event.target.closest('[data-action]')?.dataset.action;if(action==='create'){const date=document.getElementById('move-date');const name=document.getElementById('project');moveDate=date?.value||datePlus(42);projectName=name?.value.trim()||'우리 집 이사';screen('home')}else if(action==='notice')showToast('이 기능은 다음 단계에서 연결할게요.');
    });
    document.addEventListener('input',event=>{if(event.target.id==='move-date')moveDate=event.target.value;if(event.target.id==='project')projectName=event.target.value});
    screen('start');
  </script>
</body>
</html>
