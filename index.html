<style>

*{box-sizing:border-box}body{margin:0}.stage{min-height:100vh;display:grid;place-items:center;padding:22px}.app{width:min(100%,430px);height:min(900px,calc(100vh - 44px));min-height:680px;background:var(--bg);border:7px solid #111827;border-radius:38px;box-shadow:0 24px 80px #0008;overflow:hidden;display:flex;flex-direction:column;position:relative}.topbar{height:70px;flex:none;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 17px;gap:10px}.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}.mark{width:40px;height:40px;border-radius:14px;background:var(--purple);color:white;display:grid;place-items:center;box-shadow:0 5px 12px #7138ed38}.brand-copy strong{font-size:16px;line-height:1.2;display:block;letter-spacing:-.04em}.brand-copy small{font-size:10px;color:var(--muted);display:block;margin-top:3px}.top-action{height:36px;border:0;border-radius:20px;background:#f5f0ff;color:var(--purple);font-size:11px;font-weight:750;padding:0 11px;white-space:nowrap}.settings{width:37px;height:37px;border:0;border-radius:50%;background:#f0f3f8;color:#516078;display:grid;place-items:center}.content{flex:1;overflow:auto;padding:20px 16px 22px;scrollbar-width:none}.content::-webkit-scrollbar{display:none}.bottom-nav{height:68px;flex:none;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:5px 4px max(6px,env(safe-area-inset-bottom));z-index:2}.nav-btn{border:0;background:none;color:#9ba8bc;display:grid;align-content:center;justify-items:center;gap:2px;font:600 9px inherit;padding:2px 0;cursor:pointer}.nav-btn svg{width:23px;height:23px;stroke:currentColor}.nav-btn.active{color:var(--purple)}.nav-btn.active svg{filter:drop-shadow(0 2px 4px #7138ed28)}
h1,h2,h3,p{margin-top:0}.page-title{font-size:21px;letter-spacing:-.055em;margin:0 0 4px;font-weight:800}.page-sub{font-size:12px;color:var(--muted);margin:0;line-height:1.5}.page-head{display:flex;align-items:flex-start;justify-content:space-between;margin:2px 2px 17px}.add-btn{width:38px;height:38px;border:0;border-radius:50%;background:var(--purple);color:#fff;display:grid;place-items:center;box-shadow:0 5px 12px #7138ed35;cursor:pointer}.card{background:#fff;border:1px solid #edf0f6;border-radius:23px;box-shadow:0 2px 2px #18243a05}.hero{background:linear-gradient(135deg,#8137ef,#6838df 68%,#4d3dca);color:white;border-radius:27px;padding:19px 20px 18px;box-shadow:0 12px 24px #6738dc30;margin-bottom:17px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:130px;height:130px;border:1px solid #ffffff25;border-radius:50%;right:-45px;top:-55px;box-shadow:0 0 0 15px #ffffff0a,0 0 0 31px #ffffff08}.hero-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;position:relative;z-index:1}.address,.badge{border:0;border-radius:99px;background:#ffffff25;color:white;padding:7px 10px;font-weight:700;font-size:10px}.hero-kicker{font-size:11px;opacity:.86;margin:0 0 4px}.dday{display:flex;align-items:baseline;gap:7px;margin-bottom:13px}.dday strong{font-size:37px;letter-spacing:-.06em;line-height:1}.dday span{font-size:12px}.hero-progress{border-top:1px solid #ffffff35;padding-top:12px}.progress-label{display:flex;justify-content:space-between;font-size:10px;margin-bottom:7px}.track{height:7px;border-radius:99px;background:#321d865e;overflow:hidden}.track i{display:block;width:37%;height:100%;border-radius:99px;background:#ffe044}.hero-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:10px}.avatars{display:flex;padding-left:5px}.avatar{width:25px;height:25px;margin-left:-5px;border-radius:50%;border:2px solid white;background:#a593ff;color:white;display:grid;place-items:center;font-size:9px;font-weight:800}.avatar.pink{background:#ec4ca4}.section{margin-bottom:17px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px;font-size:14px;font-weight:800}.text-btn{color:var(--purple);font-size:11px;font-weight:750;border:0;background:none;padding:6px;cursor:pointer}.money-card{padding:16px}.money-title{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;margin-bottom:13px}.money-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.money-item{background:#f7f8fc;border:1px solid #eef1f6;border-radius:16px;padding:12px}.money-item small{display:block;color:var(--muted);font-size:9px;margin-bottom:6px}.money-item strong{font-size:13px;display:block}.pill{display:inline-block;margin-top:7px;padding:4px 7px;border-radius:99px;background:#f1eaff;color:var(--purple);font-size:9px;font-weight:750}.shortcut-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.shortcut{min-height:83px;display:grid;justify-items:center;align-content:center;gap:7px;text-align:center;border:1px solid #edf0f6;border-radius:17px;background:#fff;box-shadow:0 2px 3px #17203308;color:var(--ink);font-size:10px;font-weight:750;cursor:pointer}.shortcut .iconbox{width:39px;height:39px;border-radius:14px;background:#f3edff;color:var(--purple);display:grid;place-items:center}.shortcut:nth-child(2) .iconbox{background:#f7efff}.shortcut:nth-child(3) .iconbox{background:#fff5e4;color:#dc8b18}.shortcut:nth-child(4) .iconbox{background:#e9fbf3;color:#0b9d72}.task-card{padding:15px}.task-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid #f0f2f6;font-size:11px;font-weight:650}.task-row input{accent-color:var(--purple);width:17px;height:17px}.assignee{margin-left:auto;color:var(--purple);background:#f4efff;border-radius:8px;padding:5px 7px;font-size:9px}.filters{display:flex;gap:7px;overflow:auto;margin:0 0 14px;scrollbar-width:none}.filter{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;white-space:nowrap;font-size:10px;font-weight:700;color:#66748b;cursor:pointer}.filter.active{background:var(--purple);color:white;border-color:var(--purple)}.phase-card{padding:14px;margin-bottom:12px}.phase-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-size:11px;font-weight:800}.count{border-radius:9px;background:#f4efff;color:var(--purple);padding:5px 8px;font-size:9px}.checkline{display:flex;align-items:center;gap:9px;min-height:42px;padding:7px 9px;background:#f8f9fc;border-radius:13px;margin-top:7px;font-size:10px;font-weight:650}.checkline input{accent-color:#7038ed;width:16px;height:16px;flex:none}.checkline.done span{text-decoration:line-through;color:#9aa5b6}.checkline small{margin-left:auto;color:var(--purple);font-size:9px;white-space:nowrap}.service-tabs{display:flex;gap:5px;background:#eaf0f6;padding:4px;border-radius:16px;margin-bottom:14px}.service-tab{flex:1;border:0;border-radius:12px;background:transparent;padding:10px 4px;color:#53627a;font-size:9px;font-weight:750;cursor:pointer}.service-tab.active{background:white;color:var(--purple);box-shadow:0 2px 6px #15233b16}.calc{background:linear-gradient(135deg,#5d188b,#392c91);color:white;border-radius:23px;padding:17px;margin-bottom:14px}.calc-head{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:800;margin-bottom:13px}.calc label{display:block;font-size:10px;opacity:.84;margin-bottom:7px}.calc-input{display:flex;align-items:center;gap:8px}.calc-input input{width:100%;background:#ffffff1b;border:1px solid #ffffff38;border-radius:13px;padding:11px 12px;color:white;font-size:14px;outline-color:#fff}.estimate{border-top:1px solid #ffffff35;margin-top:13px;padding-top:12px;display:flex;justify-content:space-between;font-size:10px}.estimate strong{font-size:16px;color:#ffdf3c}.expert-card{padding:14px 13px;display:flex;align-items:center;gap:10px;margin-bottom:10px}.expert-icon{width:39px;height:39px;border-radius:14px;background:#f2ecff;color:var(--purple);display:grid;place-items:center;flex:none}.expert-info{min-width:0;flex:1}.expert-info strong{display:block;font-size:11px;margin-bottom:4px}.expert-info small{display:block;color:var(--muted);font-size:9px;line-height:1.45}.expert-info .specialty{color:var(--purple);margin-top:4px}.request-btn{border:0;background:#f2ecff;color:var(--purple);padding:8px 9px;border-radius:11px;font-size:9px;font-weight:750;white-space:nowrap;cursor:pointer}.profile{padding:16px;display:flex;align-items:center;gap:12px;margin-bottom:15px}.profile-avatar{width:54px;height:54px;border-radius:19px;background:#eee7ff;color:var(--purple);display:grid;place-items:center;font-size:15px;font-weight:850}.profile-text{flex:1}.profile-text strong{display:block;font-size:14px}.profile-text small{display:block;color:var(--muted);font-size:10px;margin-top:5px}.setting-card{padding:15px;margin-bottom:14px}.setting-title{font-size:12px;font-weight:800;margin-bottom:12px}.member-row{display:flex;align-items:center;gap:9px;padding:10px 0;border-top:1px solid #f0f2f6}.member-dot{width:34px;height:34px;border-radius:12px;background:#6b63ed;color:white;display:grid;place-items:center;font-size:11px;font-weight:800}.member-dot.pink{background:#e94aa2}.member-copy{flex:1}.member-copy strong{display:block;font-size:10px}.member-copy small{display:block;font-size:9px;color:var(--muted);margin-top:3px}.status{font-size:9px;color:var(--green);background:#e9fbf3;border-radius:8px;padding:5px 7px}.setting-line{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #f0f2f6;padding:12px 0;font-size:10px}.setting-line input{accent-color:var(--purple)}.modal-backdrop{position:absolute;inset:0;background:#10172880;backdrop-filter:blur(4px);display:none;align-items:flex-end;z-index:5}.modal-backdrop.open{display:flex}.modal{width:100%;background:white;border-radius:27px 27px 0 0;padding:23px 20px 20px;box-shadow:0 -10px 35px #10172822}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head strong{font-size:16px}.close{border:0;background:#f1f3f7;width:32px;height:32px;border-radius:50%;font-size:17px}.field{margin:13px 0}.field label{display:block;font-size:10px;color:#65728a;font-weight:750;margin-bottom:7px}.field input,.field select{width:100%;height:44px;border:1px solid #dfe5ee;border-radius:13px;padding:0 12px;font:inherit;font-size:11px;background:#fff}.modal-actions{display:flex;gap:8px;margin-top:18px}.modal-actions button{flex:1;height:46px;border:0;border-radius:14px;font-size:12px;font-weight:800}.cancel{background:#f0f3f8;color:#516078}.save{background:var(--purple);color:white}.toast{position:absolute;bottom:78px;left:50%;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:#20283b;color:#fff;border-radius:99px;padding:11px 16px;font-size:11px;white-space:nowrap;transition:.2s;z-index:8}.toast.show{opacity:1;transform:translate(-50%,0)}
.nav-btn{font:inherit;font-size:9px;font-weight:600}
@media(max-width:500px){.stage{padding:0}.app{width:100%;height:100dvh;min-height:600px;border:0;border-radius:0;box-shadow:none}.topbar{height:68px}.content{padding:17px 15px 20px}.bottom-nav{height:65px}.page-title{font-size:20px}.hero{padding:17px 18px}.dday strong{font-size:34px}}
@media(min-width:760px){.stage{padding:25px}.app{height:min(920px,calc(100vh - 50px))}}

<body>
<div class="stage"><section class="app" aria-label="MOVE FLOW 이사 여정 도우미">
<header class="topbar"><div class="brand"><span class="mark" aria-hidden="true" id="brand-mark"></span><span class="brand-copy"><strong>MOVE FLOW</strong><small>집에서 새집까지, 한 흐름으로</small></span></div><button class="top-action" data-go="my" aria-label="공동 참여자 보기"><span id="people-icon"></span> 2명 참여 중</button><button class="settings" data-go="my" aria-label="설정"></button></header>
<main class="content" id="content"></main>
<nav class="bottom-nav" aria-label="주 메뉴" id="bottom-nav"></nav>
<div class="toast" role="status" aria-live="polite"></div>
<div class="modal-backdrop" id="task-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal"><div class="modal-head"><strong id="modal-title">새로운 공동 할 일 추가</strong><button class="close" data-close aria-label="닫기">×</button></div><div class="field"><label for="task-phase">단계</label><select id="task-phase"><option>D-30 · 계약 및 준비</option><option>D-14 · 예약 및 정리</option><option>D-7 · 잔금 및 공과금</option></select></div><div class="field"><label for="task-name">할 일</label><input id="task-name" placeholder="예: 관리사무소 주차 등록"></div><div class="field"><label for="task-owner">담당자</label><select id="task-owner"><option>나</option><option>배우자</option><option>공동</option></select></div><div class="modal-actions"><button class="cancel" data-close>취소</button><button class="save" data-save-task>추가하기</button></div></div></div>
</section></div>
<script>
const svg=(name,size=20)=>{const common=`width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"`;const paths={home:'<path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9M9 20v-7h6v7"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 10h18M8 14h3M8 17h7"/>',check:'<path d="m5 6 1.5 1.5L9 5M12 6h7M5 12l1.5 1.5L9 11M12 12h7M5 18l1.5 1.5L9 17M12 18h7"/>',scale:'<path d="M12 3v18M5 7h14M7 7l-4 7h8L7 7ZM17 7l-4 7h8l-4-7ZM7 21h10"/>',box:'<path d="m3 7 9-4 9 4-9 4-9-4Z"/><path d="M3 7v10l9 4 9-4V7M12 11v10M8 5l9 4"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0M19 4l1 1 2-2"/>',people:'<path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM20 8v6M23 11h-6"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.6a8 8 0 0 1-1.7 1l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.7-1l-1.7.6-1.4-2.4 1.4-1.1a7 7 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.6a8 8 0 0 1 1.7-1l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.7 1l1.7-.6 1.4 2.4-1.4 1.1a7 7 0 0 1 0 2Z"/>',pin:'<path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',plus:'<path d="M12 5v14M5 12h14"/>'};return `<svg ${common}>${paths[name]||paths.home}</svg>`};
const tabs=[['home','홈','home'],['schedule','일정','calendar'],['prepare','준비','check'],['services','서비스','scale'],['my','마이','user']];document.getElementById('brand-mark').innerHTML=svg('home',22);document.getElementById('people-icon').innerHTML=svg('people',14);document.querySelector('.settings').innerHTML=svg('gear',18);
const nav=document.getElementById('bottom-nav'),content=document.getElementById('content'),toast=document.querySelector('.toast');let active='home',serviceType='legal',filter='전체',tasks=[{phase:'D-30 단계 (계약 및 기본 준비)',name:'부동산 등기부등본 최종 발급 및 권리 확인',owner:'나',done:true},{phase:'D-30 단계 (계약 및 기본 준비)',name:'이사업체 3곳 방문 견적 비교 및 계약',owner:'배우자',done:true},{phase:'D-30 단계 (계약 및 기본 준비)',name:'입주청소 및 줄눈 시공 사전 예약',owner:'나',done:false},{phase:'D-14 단계 (예약 및 폐기물 정리)',name:'대형 폐기물 수거 신청 (스티커 발급)',owner:'배우자',done:false},{phase:'D-14 단계 (예약 및 폐기물 정리)',name:'인터넷 및 TV 이전 설치 신청',owner:'나',done:false},{phase:'D-7 단계 (잔금 송금 및 공과금)',name:'잔금 송금 일정과 이체 한도 확인',owner:'공동',done:false}];
function showToast(text){toast.textContent=text;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),2200)}function header(title,sub,action=''){return `<div class="page-head"><div><h1 class="page-title">${title}</h1><p class="page-sub">${sub}</p></div>${action}</div>`}function sectionTitle(t,button=''){return `<div class="section-title"><span>${t}</span>${button}</div>`}
function home(){return `<section class="hero"><div class="hero-top"><span class="address">${svg('pin',13)}　서울시 서초구 아크로리버파크 101동</span><span class="badge">전세</span></div><p class="hero-kicker">새로운 보금자리로 향하는 여정</p><div class="dday"><strong>D-42</strong><span>일 남음</span></div><div class="hero-progress"><div class="progress-label"><span>공동 체크리스트 진행률</span><b>37%</b></div><div class="track"><i></i></div><div class="hero-foot"><span>지금까지 3개 완료</span><div class="avatars"><span class="avatar">나</span><span class="avatar pink">배</span></div></div></div></section><section class="section"><div class="card money-card"><div class="money-title">${svg('calendar',17)} 계약 및 자금 일정 <button class="text-btn" data-go="schedule">전체 보기</button></div><div class="money-grid"><div class="money-item"><small>계약일 · 완료</small><strong>2026.11.05</strong><span class="pill">계약금 송금 완료</span></div><div class="money-item"><small>잔금일 · D-Day</small><strong>2026.12.16</strong><span class="pill">송금 준비</span></div></div></div></section><section class="section"><div class="shortcut-grid"><button class="shortcut" data-go="schedule"><span class="iconbox">${svg('check',21)}</span>일정 공유</button><button class="shortcut" data-go="services"><span class="iconbox">${svg('scale',21)}</span>주변 전문가</button><button class="shortcut" data-go="prepare"><span class="iconbox">${svg('box',21)}</span>물물 교환</button><button class="shortcut" data-go="my"><span class="iconbox">${svg('people',21)}</span>공동 관리</button></div></section><section class="section"><div class="card task-card">${sectionTitle('⚡ 오늘 꼭 해야 할 일','<button class="text-btn" data-go="schedule">공동 체크</button>')}<label class="task-row"><input type="checkbox" data-task-check="2"><span>입주청소 및 줄눈 시공 사전 예약</span><small class="assignee">나</small></label><label class="task-row"><input type="checkbox"><span>잔금 송금 한도 확인</span><small class="assignee">배우자</small></label></div></section><section class="section"><div class="card money-card">${sectionTitle('함께 준비 중','<button class="text-btn" data-go="my">관리</button>')}<div class="task-row"><span class="avatar">나</span><span>유영님이 계약 일정을 확인했어요</span></div><div class="task-row"><span class="avatar pink">배</span><span>민수님이 이사업체를 비교 중이에요</span></div></div></section>`}
function schedule(){const phases=['D-30 단계 (계약 및 기본 준비)','D-14 단계 (예약 및 폐기물 정리)','D-7 단계 (잔금 송금 및 공과금)'];let visible=filter==='전체'?phases:phases.filter(p=>p.startsWith(filter));return `${header('공동 일정 및 체크리스트','파트너와 함께 실시간 체크하고 진행해요.',`<button class="add-btn" data-add-task aria-label="할 일 추가">${svg('plus',23)}</button>`)}<div class="filters">${['전체','D-30','D-14','D-7'].map(x=>`<button class="filter ${filter===x?'active':''}" data-filter="${x}">${x}</button>`).join('')}</div>${visible.map(p=>{const rows=tasks.map((t,i)=>({...t,i})).filter(t=>t.phase===p);const done=rows.filter(t=>t.done).length;return `<section class="card phase-card"><div class="phase-head"><span>${p}</span><span class="count">${done}/${rows.length} 완료</span></div>${rows.map(t=>`<label class="checkline ${t.done?'done':''}"><input type="checkbox" data-task="${t.i}" ${t.done?'checked':''}><span>${t.name}</span><small>${t.owner}</small></label>`).join('')}</section>`}).join('')}`}
function prepare(){return `${header('이사 준비','거래 서류부터 이삿날 준비까지 한곳에서 관리해요.')}<div class="shortcut-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:15px"><button class="shortcut"><span class="iconbox">${svg('calendar',21)}</span>서류·계약</button><button class="shortcut"><span class="iconbox">${svg('box',21)}</span>이삿날 준비</button><button class="shortcut"><span class="iconbox">${svg('check',21)}</span>가구 나눔</button></div><div class="card phase-card"><div class="phase-head"><span>매수 · 계약 서류</span><span class="count">2/4 확인</span></div>${[['매매계약서 사본','계약 완료'],['등기부등본','최신본 발급'],['대출 신청 서류','은행 제출'],['전입 신고','입주 후']].map((x,i)=>`<label class="checkline ${i<2?'done':''}"><input type="checkbox" ${i<2?'checked':''}><span>${x[0]}</span><small>${x[1]}</small></label>`).join('')}</div><div class="card phase-card"><div class="phase-head"><span>이삿날 챙길 것</span><span class="count">1/3 확인</span></div>${[['이사 업체 예약 확인','11.09'],['전기·가스 정산','11.16'],['관리사무소 주차 등록','11.15']].map((x,i)=>`<label class="checkline ${i===0?'done':''}"><input type="checkbox" ${i===0?'checked':''}><span>${x[0]}</span><small>${x[1]}</small></label>`).join('')}</div><div class="card phase-card">${sectionTitle('이웃 간 물물교환 & 나눔','<button class="text-btn" data-notice>둘러보기</button>')}<p class="page-sub">이사 전후에 필요한 물건을 나누고 교환해요.</p></div>`}
function service(){const tabs=[['legal','법무사/등기'],['move','폐기물/이사'],['home','인테리어/청소']];const data={legal:{title:'법무사 등기 수수료 예상 계산기',label:'거래 보증금 / 매매가 입력 (억원)',amount:'5',fee:'약 500,000원',cards:[['우리동네 참좋은 법무사사무소','서초구 반포동 · 도보 5분','전세권 설정 및 소유권 이전 전문','4.9'],['신뢰 법무사 합동 사무소','서초동 · 차량 5분','대출 연계 및 당일 등기 가능','4.8']]},move:{title:'이사 비용 빠른 견적',label:'이사 유형을 선택해 주세요',amount:'포장이사 · 24평',fee:'평균 95만원~',cards:[['반포 이사 전문팀','서초구 · 방문 견적 가능','포장·정리 포함, 날짜 협의','4.9'],['꼼꼼한 이사 서비스','강남·서초 · 후기 120+','추가 비용 사전 안내','4.8']]},home:{title:'청소·인테리어 예상 견적',label:'집 크기와 서비스 선택',amount:'24평 · 입주청소',fee:'평균 32만원~',cards:[['새집맞이 클린','서초구 · 친환경 약품 사용','입주청소 및 줄눈 시공','4.9'],['반듯한 홈케어','강남·서초 · 예약 가능','시공 전후 사진 제공','4.8']]}};const d=data[serviceType];return `${header('근처 전문가 & 예상 견적','내 주소 기준 검증된 전문가와 예상 비용을 확인해요.')}<div class="service-tabs">${tabs.map(([id,label])=>`<button class="service-tab ${serviceType===id?'active':''}" data-service="${id}">${label}</button>`).join('')}</div><section class="calc"><div class="calc-head"><span>${d.title}</span>${svg('scale',21)}</div><label>${d.label}</label><div class="calc-input"><input value="${d.amount}" aria-label="견적 기준 입력"><b>${serviceType==='legal'?'억원':''}</b></div><div class="estimate"><span>예상 비용 안내 · 실제 상담으로 확인</span><strong>${d.fee}</strong></div></section>${d.cards.map(c=>`<article class="card expert-card"><span class="expert-icon">${svg(serviceType==='legal'?'scale':serviceType==='move'?'box':'home',20)}</span><div class="expert-info"><strong>${c[0]}　<span class="pill" style="margin:0">평점 ${c[3]}</span></strong><small>${c[1]}</small><small class="specialty">${c[2]}</small></div><button class="request-btn" data-request="${c[0]}">상담 신청</button></article>`).join('')}`}
function mypage(){return `${header('마이페이지 & 공동 관리자','참여자 관리와 앱 환경설정입니다.')}<section class="card profile"><span class="profile-avatar">이사</span><span class="profile-text"><strong>김이사 님</strong><small>서초구 아크로리버파크 계약 진행 중</small><span class="pill">프리미엄 멤버</span></span>${svg('gear',18)}</section><section class="card setting-card"><div class="setting-title">${svg('people',16)}　공동 참여자 관리 <button class="text-btn" data-notice>초대하기</button></div><div class="member-row"><span class="member-dot">나</span><span class="member-copy"><strong>김이사 (본인)</strong><small>관리자 권한</small></span><span class="status">접속 중</span></div><div class="member-row"><span class="member-dot pink">배</span><span class="member-copy"><strong>배우자 (파트너)</strong><small>공동 편집 권한</small></span><button class="request-btn" data-notice>콕 찌르기</button></div></section><section class="card setting-card"><div class="setting-title">앱 설정</div><label class="setting-line">푸시 알림 및 잔금일 리마인더<input type="checkbox" checked></label><label class="setting-line">다크 모드 자동 적용<input type="checkbox"></label><div class="setting-line">버전 정보 <span style="color:var(--muted)">v1.0.0 · MOVE FLOW</span></div></section>`}
function render(){nav.innerHTML=tabs.map(([id,label,icon])=>`<button class="nav-btn ${active===id?'active':''}" data-go="${id}">${svg(icon,23)}<span>${label}</span></button>`).join('');content.innerHTML=({home,schedule,prepare,services:service,my:mypage})[active]();content.scrollTop=0}
function openModal(){document.getElementById('task-modal').classList.add('open');document.getElementById('task-name').focus()}function closeModal(){document.getElementById('task-modal').classList.remove('open')}
document.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go){active=go.dataset.go;render();return}const ft=e.target.closest('[data-filter]');if(ft){filter=ft.dataset.filter;render();return}const st=e.target.closest('[data-service]');if(st){serviceType=st.dataset.service;render();return}if(e.target.closest('[data-add-task]')){openModal();return}if(e.target.closest('[data-close]')){closeModal();return}if(e.target.closest('[data-save-task]')){const name=document.getElementById('task-name').value.trim();if(!name){document.getElementById('task-name').focus();return}const phase=document.getElementById('task-phase').value;const owner=document.getElementById('task-owner').value;tasks.push({phase,name,owner,done:false});closeModal();render();showToast('공동 할 일을 추가했어요.');return}const req=e.target.closest('[data-request]');if(req){showToast(`${req.dataset.request}에 상담을 요청할게요.`);return}if(e.target.closest('[data-notice]')){showToast('이 기능은 다음 단계에서 연결할게요.')}});
document.addEventListener('change',e=>{if(e.target.matches('[data-task]')){tasks[Number(e.target.dataset.task)].done=e.target.checked;render()}if(e.target.matches('[data-task-check]')){tasks[Number(e.target.dataset.taskCheck)].done=e.target.checked;render()}});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
</script></body></html>
